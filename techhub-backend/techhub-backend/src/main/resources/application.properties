spring.application.name=techhub-backend

# Values after the colon are defaults for local development.
# Set the environment variables (DB_PASSWORD, JWT_SECRET, EMPLOYEE_PASSWORD)
# before deploying or sharing the project.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techhub}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Image uploads: UploadController allows 5 MB, Spring's own default is only 1 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT secret must be at least 32 characters
app.jwt.secret=${JWT_SECRET}
# Password for the default employee account (employee@techhub.com)
app.default-employee-password=${EMPLOYEE_PASSWORD}
# Set to true for ONE run to wipe products and reviews and reload the seed catalog.
# Set it back to false afterwards.
app.seed.reset-catalog=false